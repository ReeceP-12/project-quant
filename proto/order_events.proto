syntax = "proto3";

package projectquant;

// Shared schema for the order/control plane between the C++ execution core
// and the Python broker gateway. See docs/ARCHITECTURE.md and
// docs/decisions/0002-grpc-zeromq-ipc.md.
//
// This is a starting pile as the single source of truth: regenerate
// stubs for both languages whenever it changes, and flag schema changes
// to the whole team.

enum Side {
  SIDE_UNSPECIFIED = 0; //protobuf best practice, the default value if a field is never set should always specify being in an unset state to not look like real data. this is a safety measure so we dont ever buy without intent
  BUY = 1;
  SELL = 2;
}
enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  MARKET = 1;
  LIMIT = 2;

}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  DAY = 1;
  GTC = 2;
}

// Sent from the C++ core to the Python gateway to request an order.
message OrderIntent {
  string client_order_id = 1;  // generated by the core, used to correlate acks/fills
  string symbol = 2;
  Side side = 3;
  double quantity = 4;
  double limit_price = 5;
  OrderType order_type = 6;
  TimeInForce time_in_force = 7;


}

// Sent from the gateway back to the core once Alpaca acknowledges,
// fills, or rejects an order.
message OrderUpdate {
  string client_order_id = 1;
  string broker_order_id = 2;
  string status = 3;           // e.g. "accepted", "filled", "rejected", "cancelled"
  double filled_quantity = 4;
  double filled_avg_price = 5;
  string reject_reason = 6;    // empty unless status == "rejected"
}

// Placeholder service definition — will back the order/control plane gRPC
// connection between core and gateway.
service OrderGateway {
  rpc SubmitOrder(OrderIntent) returns (OrderUpdate);
}
