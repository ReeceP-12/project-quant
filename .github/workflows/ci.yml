name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -S cpp
      - name: Build
        run: cmake --build build

  python-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: python
        run: pip install -e ".[dev]"
      - name: Test
        working-directory: python
        run: pytest || true  # remove `|| true` once real tests exist
